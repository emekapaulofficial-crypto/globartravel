<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Package Request | Global Travel</title><style>body{font-family:Arial;margin:0;background:#f4f8fc;color:#132238}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 25px #0001}h1{color:#06254a}label{display:block;font-weight:bold;margin-top:10px}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border:1px solid #ccd8e5;border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:inline-block;background:#0876e8;color:#fff;border:0;padding:12px 16px;border-radius:8px;font-weight:bold;text-decoration:none;cursor:pointer}.actions{display:flex;gap:10px;margin-top:12px}.ok{background:#edf9f1;border:1px solid #b9e2c5;padding:14px;border-radius:9px}@media(max-width:650px){.grid,.actions{display:grid;grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><p>GLOBAL TRAVEL · PACKAGE REQUEST</p><h1 id="title">Request a travel package</h1><p>Send your trip details. This is a planning/quote request; final prices, availability and inclusions must be confirmed before payment.</p><form id="f"><div class="grid"><div><label>Full name</label><input id="n" required maxlength="120"></div><div><label>Phone / WhatsApp</label><input id="p" required maxlength="40"></div><div><label>Email</label><input id="e" type="email"></div><div><label>Destination</label><input id="d"></div><div><label>Travel date</label><input id="t" type="date"></div><div><label>Travellers</label><input id="v" type="number" min="1" max="50" value="1" required></div></div><label>Message</label><textarea id="m" rows="5" maxlength="2000"></textarea><div class="actions"><button class="btn">Send request</button><a id="w" class="btn" target="_blank">WhatsApp instead</a></div><div id="out"></div></form></div></div><script>const U='https://eavamfsbasjvngeqsyua.supabase.co',K='sb_publishable_E40QKzlb3dtIoawvmxPHfA_07t2XIxu',id=new URLSearchParams(location.search).get('package');const esc=x=>String(x??'').replace(/[&<>]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[a]));async function init(){if(!id)return;const r=await fetch(U+'/rest/v1/gta_travel_packages?select=id,title,destination&active=eq.true&id=eq.'+encodeURIComponent(id),{headers:{apikey:K,Authorization:'Bearer '+K}});const a=await r.json();if(a[0]){title.textContent='Request: '+a[0].title;d.value=a[0].destination||''}}f.onsubmit=async x=>{x.preventDefault();out.textContent='Sending...';const q={package_id:id||null,full_name:n.value.trim(),phone:p.value.trim(),email:e.value.trim()||null,destination:d.value.trim()||null,travel_date:t.value||null,travellers:Number(v.value||1),message:m.value.trim()||null};try{const r=await fetch(U+'/rest/v1/gta_package_inquiries',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(q)});const a=await r.json();if(!r.ok)throw Error('failed');out.innerHTML='<div class="ok"><b>Request received.</b><br>Reference: <b>'+esc(a[0]?.reference_code||'received')+'</b></div>';f.reset();v.value=1}catch(err){out.textContent='Could not send. Please use WhatsApp instead.'}}function wa(){w.href='https://wa.me/2348066966747?text='+encodeURIComponent('Hello Global Travel, I want a package quote. Name: '+n.value+'. Destination: '+d.value+'. Date: '+t.value+'. Travellers: '+v.value+'.')}[n,p,e,d,t,v,m].forEach(x=>x.oninput=wa);wa();init();</script></body></html>
