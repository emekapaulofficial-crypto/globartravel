<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Admin Password | Global Travel Agency</title><style>body{font-family:Inter,Arial,sans-serif;background:#f4f8fc;color:#132238;margin:0}.wrap{width:min(520px,92%);margin:50px auto}.card{background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:24px;box-shadow:0 8px 25px #092b5510}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5dfe9;border-radius:8px;margin:6px 0 14px;font:inherit}.btn{background:#0868d7;color:#fff;border:0;padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}.notice{padding:14px;border-radius:10px;background:#fff7df;border:1px solid #f0d37a;margin-top:14px}.ok{background:#edf9f1;border-color:#b9e2c5}a{color:#0868d7}</style></head><body><main class="wrap"><div class="card"><h1>Set your admin password</h1><p>Enter a new password for the Global Travel Agency admin account.</p><form id="form"><label>New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label>Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button class="btn">Update password</button></form><div id="msg"></div><p><a href="admin.html">Back to admin login</a></p></div></main><script>const URL='https://eavamfsbasjvngeqsyua.supabase.co',KEY='sb_publishable_E40QKzlb3dtIoawvmxPHfA_07t2XIxu';const msg=document.getElementById('msg');function show(t,ok=false){msg.innerHTML='<div class="notice '+(ok?'ok':'')+'">'+t+'</div>}async function getSessionFromHash(){const h=new URLSearchParams(location.hash.slice(1));const access=h.get('access_token'),refresh=h.get('refresh_token');if(access&&refresh){localStorage.setItem('gta_recovery_access',access);localStorage.setItem('gta_recovery_refresh',refresh);return access}return localStorage.getItem('gta_recovery_access')||''}form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value){show('The passwords do not match.');return}if(password.value.length<8){show('Use at least 8 characters.');return}const access=await getSessionFromHash();if(!access){show('This reset link is missing or expired. Request a new reset email.');return}const r=await fetch(URL+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok){show(d.msg||d.error_description||'Could not update the password. Request a new reset email.');return}localStorage.removeItem('gta_recovery_access');localStorage.removeItem('gta_recovery_refresh');history.replaceState({},document.title,location.pathname);show('Password updated successfully. You can now sign in to the admin dashboard.',true);setTimeout(()=>location.href='admin.html',1200)};getSessionFromHash();</script></body></html>
