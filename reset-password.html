<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Admin Password | Global Travel Agency</title><style>body{font-family:Inter,Arial,sans-serif;background:#f4f8fc;color:#132238;margin:0}.wrap{width:min(520px,92%);margin:50px auto}.card{background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:24px;box-shadow:0 8px 25px #092b5510}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5dfe9;border-radius:8px;margin:6px 0 14px;font:inherit}.btn{display:inline-block;background:#0868d7;color:#fff;border:0;padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}.notice{padding:14px;border-radius:10px;background:#fff7df;border:1px solid #f0d37a;margin-top:14px}.ok{background:#edf9f1;border-color:#b9e2c5}a{color:#0868d7}</style></head><body><main class="wrap"><div class="card"><h1>Admin password reset</h1><p>Enter the email used for the Global Travel Agency admin account. We will send a Supabase password-reset email.</p><form id="requestForm"><label>Email</label><input id="email" type="email" value="pigwe714@gmail.com" required><button class="btn">Send reset email</button></form><div id="msg"></div><p><a href="admin.html">Back to admin login</a></p></div></main><script>const URL='https://eavamfsbasjvngeqsyua.supabase.co',KEY='sb_publishable_E40QKzlb3dtIoawvmxPHfA_07t2XIxu';requestForm.onsubmit=async e=>{e.preventDefault();msg.innerHTML='<div class="notice">Sending reset email...</div>';try{const r=await fetch(URL+'/auth/v1/recover',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),redirect_to:'https://globaltravelagency-dam.pages.dev/update-password.html'})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.error_description||'Could not request password reset');msg.innerHTML='<div class="notice ok">If this email is registered, a password-reset email has been requested. Check the inbox and spam folder, then return to the admin login.</div>'}catch(err){msg.innerHTML='<div class="notice">'+String(err.message||err)+'</div>'}};</script></body></html>
